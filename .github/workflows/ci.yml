name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
jobs:
  build-esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: bash tools/install_deps.sh
      - name: Interdire setInsecure (la vérification TLS doit rester active)
        run: |
          if grep -rn 'setInsecure' vigie_node; then
            echo "setInsecure() est interdit"; exit 1
          fi
      - name: Compile the sketch
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings more --output-dir build vigie_node
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.bin
