name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned deps
        run: bash tools/install_deps.sh
      - name: Forbid setInsecure (TLS verification must stay on)
        run: |
          if grep -rn 'setInsecure' vigie_node; then
            echo "setInsecure() est interdit"; exit 1
          fi
      - name: Compile the sketch
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings more --output-dir build vigie_node
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: build/*.bin
