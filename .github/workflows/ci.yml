name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
jobs:
  build-esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32 --additional-urls "$ESP32_INDEX"
      - name: Compile the sketch
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build vigie_node
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.bin
