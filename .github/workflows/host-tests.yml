name: host-tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S test_apps/host_unit -B build-host -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-host
      - run: ctest --test-dir build-host --output-on-failure
